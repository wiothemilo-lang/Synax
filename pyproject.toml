[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synax"
version = "0.1.0"
description = "Train a Vietnamese language model from scratch on a zero-budget stack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wiothemilo-lang" }]
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
    "sentencepiece>=0.2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
torch = ["torch>=2.5"]
data = ["datasketch>=1.6"]
dev = ["pytest>=8.0", "ruff==0.17.5", "torch>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
